# Publishes @lanework/contracts when a tag `v<version>` is pushed, and only
# when the tag matches package.json. The only way a version reaches npm: no
# more tarballs built from a temp folder.
#
# npm Trusted Publishing (OIDC): no token. The package's npm settings name
# this repository and `publish.yml` as its trusted publisher; npm >= 11.5
# (Node 24) trades the job's id-token for a short-lived publish credential.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # A version already on npm (published by hand, or a re-pushed tag) is
      # skipped, not failed: npm never lets a version be published twice.
      - name: Already on npm?
        id: seen
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.seen.outputs.published != 'true'
        run: npm publish --access public --provenance
